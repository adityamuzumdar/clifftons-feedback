services:
  - type: web
    name: clifton-feedback
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clifton-feedback-db
          property: connectionString

databases:
  - name: clifton-feedback-db
    databaseName: clifton_feedback
    plan: free
